<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkspur Bakehouse, tomorrow's bake list</title>
<meta name="description" content="Tomorrow's bake list for a fictional four-location bakery, from a 28-day demand forecast with a backtest against a naive baseline and calibrated ranges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Mulish:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --flour:#FBF8F1; --surface:#FFFFFF; --crust:#3A2A1E; --muted:#6F6355; --faint:#938876;
  --hair:#E6DFD2; --blue:#2F5D8A; --band:rgba(47,93,138,.15); --r:8px;
}
*{box-sizing:border-box}
html,body{background:var(--flour)}
body{margin:0;color:var(--crust);font-family:Mulish,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:30px 36px 46px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
h1{font-family:Gloock,Georgia,serif;font-weight:400;font-size:34px;line-height:1.1;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;padding:8px 11px;border:1px solid var(--hair);border-radius:var(--r);
  background:var(--surface);color:var(--crust)}
.btn{font:inherit;font-weight:600;padding:8px 16px;border-radius:var(--r);border:1px solid var(--blue);
  background:var(--blue);color:#fff;cursor:pointer;transition:background .15s ease-out}
.btn:hover{background:#27506f}
.btn.quiet{background:transparent;color:var(--blue)}
.btn.quiet:hover{background:var(--band)}

h2{font-family:Gloock,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 14px}
section{margin-bottom:30px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:22px 24px}

/* the bake list leads the page */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 28px}
.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--hair)}
.row .name{font-size:16px}
.row .unit{color:var(--faint);font-size:13px;margin-left:6px}
.row .qty{font-family:Gloock,Georgia,serif;font-size:21px;white-space:nowrap}
.row .bake{color:var(--muted);font-size:13px;display:block;text-align:right}
.total{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);display:flex;
  justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.total .big{font-family:Gloock,Georgia,serif;font-size:24px}
.total .why{color:var(--muted);font-size:13.5px;max-width:58ch}

/* chart */
.chartwrap{position:relative}
svg{display:block;width:100%;height:auto}
.axis{fill:var(--faint);font-size:11px}
.gridline{stroke:var(--hair);stroke-width:1}
.hist{fill:none;stroke:#B9AE9B;stroke-width:1.6}
.fc{fill:none;stroke:var(--blue);stroke-width:2.4}
.bandfill{fill:var(--band)}
.note-leader{stroke:var(--faint);stroke-width:.75}
.note-text{font-style:italic;font-size:12px;fill:var(--muted);font-family:Mulish,sans-serif}
.legend{display:flex;gap:18px;color:var(--muted);font-size:13px;margin-top:10px;flex-wrap:wrap}
.swatch{display:inline-block;width:22px;height:0;border-top:2.4px solid var(--blue);
  vertical-align:middle;margin-right:7px}
.swatch.past{border-top:1.6px solid #B9AE9B}
.swatch.band{height:11px;border:0;background:var(--band);vertical-align:-2px}

/* backtest */
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:13px}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
.state{color:var(--muted)}
.state strong{color:var(--crust);font-weight:600}
footer{color:var(--faint);font-size:12.5px;border-top:1px solid var(--hair);padding-top:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}.wrap{padding:22px 16px 34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{margin:14mm}
  body{background:#fff}
  /* The printed page is the list a baker pins up, so everything that only
     makes sense on screen comes off it. */
  .controls,#chart-section,#backtest,#daypick-wrap,footer .hideprint{display:none}
  .card{border:0;padding:0}
  .wrap{padding:0;max-width:none}
  h1{font-size:26px}
  .list{grid-template-columns:1fr 1fr;gap:0 36px}
  .row{break-inside:avoid}
  .total{margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Larkspur Bakehouse</h1>
      <p class="sub" id="strapline">Tomorrow's bake list, from the 28 day demand forecast.</p>
    </div>
    <div class="controls">
      <select id="store" aria-label="Choose a location"></select>
      <button class="btn" id="print">Print the list</button>
      <button class="btn quiet" id="csv">Download 28 days as CSV</button>
    </div>
  </header>

  <section id="bake"></section>
  <p class="lede" id="daypick-wrap" style="margin:-18px 0 30px">
    <label for="daypick">Show another day</label>
    <select id="daypick" aria-label="Choose a day to bake for" style="margin-left:8px"></select>
  </p>

  <section id="chart-section">
    <h2>The next 28 days</h2>
    <p class="lede" id="chart-lede"></p>
    <div class="card chartwrap"><div id="chart"></div>
      <div class="legend">
        <span><i class="swatch past"></i>Sales so far</span>
        <span><i class="swatch"></i>Forecast</span>
        <span><i class="swatch band"></i>80% range</span>
      </div>
    </div>
  </section>

  <section id="backtest">
    <h2>How it did on days it had not seen</h2>
    <p class="lede" id="bt-lede"></p>
    <div class="card two">
      <div>
        <table>
          <thead><tr><th>Location</th><th class="r">This model</th><th class="r">Repeat last week</th></tr></thead>
          <tbody id="bt-rows"></tbody>
        </table>
      </div>
      <div class="state" id="bt-notes"></div>
    </div>
  </section>

  <footer>
    <span class="hideprint">Fictional business, invented data. </span>
    <span id="stamp"></span>
  </footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
